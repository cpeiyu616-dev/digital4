<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>幾A幾B大挑戰・雲端版</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 500px; text-align: center; }
    h1 { margin-bottom: 10px; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    input { width: calc(100% - 22px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 18px; text-align: center; margin-bottom: 15px; letter-spacing: 4px; }
    .msg { margin-top: 15px; font-weight: bold; color: #f43f5e; }
  </style>
</head>
<body>
  <!-- 初始登入/建立畫面 -->
  <div class="card" id="gateCard">
    <h1>幾A幾B大挑戰</h1>
    <p>點擊下方按鈕立刻從雲端載入你的專屬遊戲存檔</p>
    <button onclick="initGame()">載入遊戲並開始</button>
    <div id="statusMsg" class="msg"></div>
  </div>

  <!-- 遊戲主畫面 -->
  <div class="card" id="gameCard" style="display:none;">
    <h1>幾A幾B大挑戰</h1>
    <p>玩家代號：<span id="playerCode" style="color:#38bdf8; font-weight:bold;"></span></p>
    <div id="gameInfo"></div>
    <div style="margin: 20px 0;">
      <input type="text" id="guessInput" maxlength="4" placeholder="輸入4位不重複數字">
      <button onclick="makeGuess()">送出猜測</button>
    </div>
    <button onclick="newGame()" style="background:#334155; margin-top:5px;">開新局</button>
    <div id="gameMsg" class="msg"></div>
    <div id="historyBox" style="text-align:left; margin-top:20px; max-height:150px; overflow-y:auto; font-size:13px; color:#cbd5e1;"></div>
  </div>

  <script>
    // 已完整綁定你的 Apps Script 正式部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzoRMKIlQ2xYtM1XlUMCL43snuLaBEoJA6uM03s7bw8avELC9VRr4P8bc4tx4d8dZaK/exec";

    let player = "";
    let rounds = [];
    let selectedId = null;

    async function callApi(action, extraData = {}) {
      try {
        if (action === 'load' || action === 'new') {
          let res = await fetch(`${GAS_URL}?action=${action}`);
          let data = await res.json();
          return data;
        }

        let res = await fetch(GAS_URL, {
          method: "POST",
          redirect: "follow",
          body: JSON.stringify({ action: action, ...extraData })
        });
        let data = await res.json();
        return data;
      } catch (err) {
        return { ok: false, error: err.toString() };
      }
    }

    async function initGame() {
      let statusEl = document.getElementById('statusMsg');
      if(statusEl) statusEl.innerText = "連線載入中...";
      let res = await callApi('load');
      onResponse(res);
    }

    async function newGame() {
      let res = await callApi('new');
      onResponse(res);
    }

    async function makeGuess() {
      let val = document.getElementById('guessInput').value;
      if (!val || val.length !== 4) {
        document.getElementById('gameMsg').innerText = "請輸入剛好 4 位數字！";
        return;
      }
      let res = await callApi('guess', { gameId: selectedId, value: val });
      document.getElementById('guessInput').value = "";
      onResponse(res);
    }

    function onResponse(res) {
      if (res && res.ok) {
        player = res.code;
        rounds = res.rounds || [];
        const requested = res.selectedId || selectedId;
        selectedId = rounds.some(r => r.id === requested) ? requested : (rounds[rounds.length - 1] || {}).id || null;
        
        // 收到資料後立刻隱藏初始畫面，解鎖遊戲面板
        document.getElementById('gateCard').style.display = 'none';
        document.getElementById('gameCard').style.display = 'block';
        
        document.getElementById('playerCode').innerText = player;
        renderGame();
        
        let msgEl = document.getElementById('gameMsg');
        if (msgEl) msgEl.innerText = res.message || "";
      } else {
        let statusEl = document.getElementById('statusMsg');
        if (statusEl) statusEl.innerText = "錯誤：" + (res ? res.error : "連線失敗");
      }
    }

    function renderGame() {
      let game = rounds.find(r => r.id === selectedId);
      let infoDiv = document.getElementById('gameInfo');
      let historyDiv = document.getElementById('historyBox');

      if (!game) {
        infoDiv.innerHTML = "<p>目前沒有進行中的遊戲，請點擊下方「開新局」開始！</p>";
        historyDiv.innerHTML = "";
        return;
      }

      infoDiv.innerHTML = `<p>第 ${game.number} 局 ｜ 狀態：<b>${game.status === 'playing' ? '進行中' : '已通關！'}</b></p>`;
      
      let html = "<b>猜測歷程：</b><br>";
      game.guesses.forEach(g => {
        html += `&bull; 第 ${g.order} 次：${g.value} &rarr; <span style="color:#38bdf8; font-weight:bold;">${g.result}</span><br>`;
      });
      historyDiv.innerHTML = html;
    }

    // 網頁開啟時自動觸發載入
    window.onload = function() {
      initGame();
    };
  </script>
</body>
</html>
