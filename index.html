<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>幾A幾B大挑戰・雲端版</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 550px; text-align: center; margin-bottom: 20px; }
    h1 { margin-bottom: 10px; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    input { width: calc(100% - 22px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 18px; text-align: center; margin-bottom: 15px; letter-spacing: 4px; }
    .msg { margin-top: 15px; font-weight: bold; color: #38bdf8; padding: 10px; border-radius: 8px; background: #0f172a; }
    .error { color: #f43f5e !important; }
    .tag { display: inline-block; padding: 4px 10px; background: #334155; border-radius: 6px; font-size: 13px; color: #38bdf8; margin-bottom: 15px; }
    details { background: #0f172a; border-radius: 8px; margin: 10px 0; text-align: left; padding: 10px; border: 1px solid #334155; }
    summary { cursor: pointer; font-weight: bold; color: #38bdf8; }
  </style>
</head>
<body>
<main style="width: 100%; max-width: 550px;">

  <!-- 初始建立存檔閘道畫面 -->
  <div class="card" id="gateCard">
    <h1>幾A幾B大挑戰</h1>
    <p id="statusMsg" class="msg">正在確認 Google 帳號與雲端狀態...</p>
    <div id="identity" class="tag">尚未確認帳號</div>
    <div id="createSection" style="display:none;">
      <p style="font-size:13px; color:#94a3b8;">首次使用將在你的 Google 雲端硬碟建立專屬私人試算表來保存紀錄。</p>
      <button onclick="createSave()" style="background:#10b981;">建立我的遊戲存檔</button>
    </div>
    <button onclick="checkLoad()" style="background:#334155; margin-top:10px;">重新確認帳號與存檔</button>
  </div>

  <!-- 遊戲主畫面 -->
  <div class="card" id="gameCard" style="display:none;">
    <h1>幾A幾B大挑戰</h1>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span id="playerCode" class="tag"></span>
      <a id="sheetLink" href="#" target="_blank" style="color: #38bdf8; font-size: 13px;">開啟我的試算表 ↗</a>
    </div>
    <div id="roundTitle" style="font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #f8fafc;"></div>
    
    <div style="margin: 20px 0;">
      <input type="text" id="guessInput" maxlength="4" autocomplete="off" placeholder="4位不重複數字">
      <button id="submitBtn" onclick="makeGuess()">送出猜測</button>
    </div>
    
    <button onclick="newGame()" style="background:#334155;">開新局（保留舊局）</button>
    <div id="gameMsg" class="msg">請輸入 4 位不重複數字開始挑戰！</div>

    <!-- 歷史歷程 -->
    <div id="historyBox" style="margin-top:20px; max-height:200px; overflow-y:auto;"></div>
  </div>

</main>

<script>
  // 請確認這裡填入你最新的以 /exec 結尾的正式網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzoRMKIlQ2xYtM1XlUMCL43snuLaBEoJA6uM03s7bw8avELC9VRr4P8bc4tx4d8dZaK/exec";

  let ready = false;
  let player = "";
  let rounds = [];
  let selectedId = null;

  function uid() {
    return 'req-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  }

  async function callApi(action, extraData = {}) {
    try {
      let res = await fetch(GAS_URL, {
        method: "POST",
        redirect: "follow",
        body: JSON.stringify({ action: action, ...extraData })
      });
      let data = await res.json();
      return data;
    } catch (err) {
      return { ok: false, error: err.toString() };
    }
  }

  async function checkLoad() {
    document.getElementById('statusMsg').innerText = "連線載入中...";
    let res = await callApi('load');
    handleResponse(res);
  }

  async function createSave() {
    document.getElementById('statusMsg').innerText = "正在建立個人試算表...";
    let res = await callApi('create', { consent: true });
    handleResponse(res);
  }

  async function newGame() {
    let res = await callApi('new', { requestId: uid() });
    handleResponse(res);
  }

  async function makeGuess() {
    let val = document.getElementById('guessInput').value;
    if (!val || val.length !== 4) {
      let msg = document.getElementById('gameMsg');
      msg.innerText = "請輸入剛好 4 位數字！";
      msg.className = "msg error";
      return;
    }
    let game = rounds.find(r => r.id === selectedId);
    if (!game) return;

    let res = await callApi('guess', { gameId: game.id, revision: game.revision, value: val, requestId: uid() });
    document.getElementById('guessInput').value = "";
    handleResponse(res);
  }

  function handleResponse(res) {
    if (!res || !res.ok) {
      let statusEl = document.getElementById('statusMsg');
      statusEl.innerText = "錯誤：" + (res ? res.error : "連線失敗");
      statusEl.className = "msg error";
      return;
    }

    player = res.code;
    ready = res.ready;
    rounds = res.rounds || [];
    
    document.getElementById('identity').innerText = "Google 帳號：" + player;

    if (!ready) {
      // 尚未建立存檔，停在閘道畫面並顯示建立按鈕
      document.getElementById('gateCard').style.display = 'block';
      document.getElementById('gameCard').style.display = 'none';
      document.getElementById('statusMsg').innerText = res.message;
      document.getElementById('statusMsg').className = "msg";
      document.getElementById('createSection').style.display = 'block';
      return;
    }

    // 已準備好，進入遊戲主畫面
    document.getElementById('gateCard').style.display = 'none';
    document.getElementById('gameCard').style.display = 'block';
    document.getElementById('playerCode').innerText = "帳號：" + player;

    if (res.sheetUrl) {
      document.getElementById('sheetLink').href = res.sheetUrl;
    }

    const requested = res.selectedId || selectedId;
    selectedId = rounds.some(r => r.id === requested) ? requested : (rounds[rounds.length - 1] || {}).id || null;

    renderGame();
    
    let msgEl = document.getElementById('gameMsg');
    msgEl.innerText = res.message || "";
    msgEl.className = "msg";
  }

  function renderGame() {
    let game = rounds.find(r => r.id === selectedId);
    let roundTitle = document.getElementById('roundTitle');
    let historyBox = document.getElementById('historyBox');
    let guessInput = document.getElementById('guessInput');
    let submitBtn = document.getElementById('submitBtn');

    if (!game) {
      roundTitle.innerText = "目前沒有進行中的遊戲";
      guessInput.disabled = true;
      submitBtn.disabled = true;
      historyBox.innerHTML = "<p style='color:#94a3b8; font-size:13px;'>請點擊下方「開新局」開始挑戰！</p>";
      return;
    }

    let isPlaying = game.status === 'playing';
    roundTitle.innerHTML = `第 ${game.number} 局 ｜ 狀態：<b>${isPlaying ? '進行中' : '已通關！'}</b>`;
    guessInput.disabled = !isPlaying;
    submitBtn.disabled = !isPlaying;

    // 渲染歷史與歷程
    let html = "<b style='color:#38bdf8; font-size:14px;'>歷史紀錄與切換：</b><br>";
    [...rounds].reverse().forEach(r => {
      let activeStyle = r.id === selectedId ? "background:#0284c7; color:white;" : "background:#1e293b; color:#cbd5e1;";
      html += `<button onclick="selectRound('${r.id}')" style="margin:4px 0; padding:6px; font-size:13px; text-align:left; ${activeStyle}">
        第 ${r.number} 局 [${r.status === 'won' ? '已完成' : '進行中'}] - ${r.guesses.length} 次猜測
      </button>`;
    });

    if (game.guesses.length > 0) {
      html += "<br><br><b style='color:#38bdf8; font-size:14px;'>當前局猜測歷程：</b><br>";
      game.guesses.forEach(g => {
        html += `<div style="font-size:13px; color:#cbd5e1; padding:4px 0; border-bottom:1px solid #334155;">
          第 ${g.order} 次：<b>${g.value}</b> &rarr; <span style="color:#38bdf8; font-weight:bold;">${g.result}</span>
        </div>`;
      });
    }
    historyBox.innerHTML = html;
  }

  function selectRound(id) {
    selectedId = id;
    renderGame();
  }

  // 網頁開啟時自動觸發讀取
  window.onload = function() {
    checkLoad();
  };
</script>
</body>
</html>
