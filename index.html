<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幾A幾B大挑戰</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; max-width: 480px; width: 100%; text-align: center; }
    h1 { color: #38bdf8; font-size: 24px; margin: 0 0 12px; }
    p { color: #cbd5e1; font-size: 14px; line-height: 1.6; }
    a.btn { display: block; background: #0284c7; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>幾A幾B大挑戰</h1>
    <p>正在帶你前往遊戲。遊戲會使用你的 Google 帳號保存進度；首次使用需要完成 Google 授權，並按「建立我的遊戲存檔」。</p>
    <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbzK1UREKhJNHKtCT_2-VByb_asuq1MsvVVw7OdIeZH9bG1bPxqlXR37epX0sIiBBG83/exec">前往遊戲</a>
  </div>
  <script>
    // 開啟這個 GitHub 連結後，自動轉到 Apps Script 遊戲（帳號偵測在那邊進行）
    var url = document.getElementById('go').href;
    if (url.indexOf('/exec') !== -1) setTimeout(function () { location.replace(url); }, 800);
  </script>
</body>
</html>
