<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>幾A幾B大挑戰・雲端個人版</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 550px; text-align: center; margin-bottom: 20px; }
    h1 { margin-bottom: 10px; font-size: 24px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input { width: calc(100% - 22px); padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 18px; text-align: center; margin-bottom: 15px; letter-spacing: 4px; }
    .msg { margin-top: 15px; font-weight: bold; color: #38bdf8; padding: 10px; border-radius: 8px; background: #0f172a; font-size: 14px; }
    .error { color: #f43f5e !important; }
    .tag { display: inline-block; padding: 6px 12px; background: #334155; border-radius: 6px; font-size: 13px; color: #38bdf8; margin-bottom: 15px; word-break: break-all; }
    .notice { padding: 14px; background: #334155; border-radius: 8px; font-size: 13px; color: #cbd5e1; text-align: left; margin-bottom: 20px; line-height: 1.5; }
  </style>
</head>
<body>
<main style="width: 100%; max-width: 550px;">

  <!-- 初始建立存檔閘道畫面 -->
  <div class="card" id="gateCard">
    <h1>幾A幾B大挑戰</h1>
    <p class="notice">
      <b>版本四雲端說明：</b>正在透過 GitHub 連線您的雲端個人試算表。
    </p>
    <div id="statusMsg" class="msg">正在與雲端建立連線...</div>
    <div id="identity" class="tag" style="margin-top: 10px;">尚未確認帳號</div>
    
    <div id="createSection" style="display:none; margin-top: 20px;">
      <button onclick="createSave()" style="background:#10b981;">建立我的遊戲存檔</button>
    </div>
    <button onclick="checkLoad()" style="background:#334155; margin-top:10px;">重新確認帳號與存檔</button>
  </div>

  <!-- 遊戲主畫面 -->
  <div class="card" id="gameCard" style="display:none;">
    <h1>幾A幾B大挑戰</h1>
    <div style="display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 15px; gap: 8px;">
      <span id="playerCode" class="tag" style="margin-bottom:0; width: 100%; text-align: left;"></span>
      <a id="sheetLink" href="#" target="_blank" style="color: #38bdf8; font-size: 13px; text-decoration: none;" hidden>開啟我的雲端試算表 ↗</a>
    </div>
    
    <div id="roundTitle" style="font-weight: bold; font-size: 16px; margin: 15px 0; color: #f8fafc;"></div>
    
    <div style="margin: 20px 0;">
      <input type="text" id="guessInput" maxlength="4" autocomplete="off" placeholder="輸入4位不重複數字">
      <button id="submitBtn" onclick="makeGuess()">送出猜測</button>
    </div>
    
    <button onclick="newGame()" style="background:#334155;">開新局（保留舊局）</button>
    <button onclick="checkLoad()" style="background:#1e293b; border: 1px solid #475569; font-size: 14px; padding: 8px;">重新讀取雲端</button>
    
    <div id="gameMsg" class="msg" style="margin-top: 15px;">遊戲已準備就緒！</div>

    <!-- 歷史歷程與局數切換專區 -->
    <div id="historyBox" style="margin-top:20px; max-height:220px; overflow-y:auto; text-align: left;"></div>
  </div>

</main>

<script>
  // 已更新為你最新的 Apps Script 正式部署網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwcj20MFqNK4VMDA0uS_JUpu1Y8W8Q4EHk7kUsvid-HehzXgf1wotrAazxFo8RGUqXp/exec";

  let ready = false;
  let player = "";
  let rounds = [];
  let selectedId = null;

  function uid() {
    return 'req-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
  }

  // 完美繞過 CORS 的 JSONP 請求核心
  function callApi(action, extraData = {}) {
    return new Promise((resolve) => {
      const callbackName = 'jsonp_cb_' + Math.random().toString(36).substring(2, 9);
      const payload = encodeURIComponent(JSON.stringify({ action: action, ...extraData }));
      
      window[callbackName] = function(data) {
        delete window[callbackName];
        if (scriptNode && scriptNode.parentNode) {
          scriptNode.parentNode.removeChild(scriptNode);
        }
        resolve(data);
      };

      const scriptNode = document.createElement('script');
      scriptNode.src = `${GAS_URL}?data=${payload}&callback=${callbackName}`;
      
      scriptNode.onerror = function() {
        delete window[callbackName];
        if (scriptNode && scriptNode.parentNode) {
          scriptNode.parentNode.removeChild(scriptNode);
        }
        resolve({ ok: false, error: "連線至 Google 雲端失敗，請確認網路或重新整理。" });
      };
      
      document.body.appendChild(scriptNode);
    });
  }

  async function checkLoad() {
    document.getElementById('statusMsg').innerText = "正在讀取雲端資料…";
    let res = await callApi('load');
    handleResponse(res);
  }

  async function createSave() {
    document.getElementById('statusMsg').innerText = "正在建立個人試算表，請稍候…";
    let res = await callApi('create', { consent: true });
    handleResponse(res);
  }

  async function newGame() {
    let res = await callApi('new', { requestId: uid() });
    handleResponse(res);
  }

  async function makeGuess() {
    let val = document.getElementById('guessInput').value.trim();
    if (!val || val.length !== 4 || !/^\d{4}$/.test(val)) {
      let msg = document.getElementById('gameMsg');
      msg.innerText = "請輸入剛好 4 位數字！";
      msg.className = "msg error";
      return;
    }
    let set = new Set(val.split(''));
    if (set.size !== 4) {
      let msg = document.getElementById('gameMsg');
      msg.innerText = "4位數字不能重複！";
      msg.className = "msg error";
      return;
    }

    let game = rounds.find(r => r.id === selectedId);
    if (!game) return;

    let res = await callApi('guess', { gameId: game.id, revision: game.revision, value: val, requestId: uid() });
    document.getElementById('guessInput').value = "";
    handleResponse(res);
  }

  function handleResponse(res) {
    if (!res || !res.ok) {
      let statusEl = document.getElementById('statusMsg');
      statusEl.innerText = "錯誤：" + (res ? res.error : "連線失敗");
      statusEl.className = "msg error";
      return;
    }

    player = res.code;
    ready = res.ready;
    rounds = res.rounds || [];
    
    document.getElementById('identity').innerText = "Google 帳號：" + player;

    if (!ready) {
      document.getElementById('gateCard').style.display = 'block';
      document.getElementById('gameCard').style.display = 'none';
      document.getElementById('statusMsg').innerText = res.message;
      document.getElementById('statusMsg').className = "msg";
      document.getElementById('createSection').style.display = 'block';
      return;
    }

    document.getElementById('gateCard').style.display = 'none';
    document.getElementById('gameCard').style.display = 'block';
    document.getElementById('playerCode').innerText = "Google 帳號：" + player;

    if (res.sheetUrl) {
      let sheetLink = document.getElementById('sheetLink');
      sheetLink.href = res.sheetUrl;
      sheetLink.hidden = false;
    }

    const requested = res.selectedId || selectedId;
    selectedId = rounds.some(r => r.id === requested) ? requested : (rounds[rounds.length - 1] || {}).id || null;

    renderGame();
    
    let msgEl = document.getElementById('gameMsg');
    msgEl.innerText = res.message || "";
    msgEl.className = "msg";
  }

  function renderGame() {
    let game = rounds.find(r => r.id === selectedId);
    let roundTitle = document.getElementById('roundTitle');
    let historyBox = document.getElementById('historyBox');
    let guessInput = document.getElementById('guessInput');
    let submitBtn = document.getElementById('submitBtn');

    if (!game) {
      roundTitle.innerText = "目前沒有進行中的遊戲";
      guessInput.disabled = true;
      submitBtn.disabled = true;
      historyBox.innerHTML = "<p style='color:#94a3b8; font-size:13px; text-align:center;'>目前尚無遊戲紀錄，請點擊上方「開新局」開始挑戰！</p>";
      return;
    }

    let isPlaying = game.status === 'playing';
    roundTitle.innerHTML = `第 ${game.number} 局 ｜ 狀態：<b>${isPlaying ? '進行中' : '已通關！'}</b>`;
    guessInput.disabled = !isPlaying;
    submitBtn.disabled = !isPlaying;

    let html = "<b style='color:#38bdf8; font-size:14px;'>雲端遊玩歷史與切換：</b><br>";
    html += "<div style='display:flex; flex-wrap:wrap; gap:6px; margin: 8px 0;'>";
    [...rounds].reverse().forEach(r => {
      let activeStyle = r.id === selectedId ? "background:#0284c7; color:white; border:1px solid #38bdf8;" : "background:#0f172a; color:#cbd5e1; border:1px solid #334155;";
      html += `<button onclick="selectRound('${r.id}')" style="width:auto; padding:6px 12px; font-size:12px; margin-top:0; ${activeStyle}">
        第 ${r.number} 局 (${r.status === 'won' ? '已完成' : '進行中'})
      </button>`;
    });
    html += "</div>";

    if (game.guesses.length > 0) {
      html += "<br><b style='color:#38bdf8; font-size:14px;'>第 " + game.number + " 局猜測歷程：</b><br>";
      game.guesses.forEach(g => {
        html += `<div style="font-size:13px; color:#cbd5e1; padding:6px 8px; border-bottom:1px solid #334155; display:flex; justify-content:space-between;">
          <span>第 ${g.order} 次：<b>${g.value}</b></span>
          <span style="color:#38bdf8; font-weight:bold;">${g.result}</span>
        </div>`;
      });
    } else {
      html += "<p style='color:#94a3b8; font-size:13px; margin-top:10px;'>此局尚未有猜測紀錄。</p>";
    }
    historyBox.innerHTML = html;
  }

  function selectRound(id) {
    selectedId = id;
    renderGame();
  }

  window.onload = function() {
    checkLoad();
  };
</script>
</body>
</html>
